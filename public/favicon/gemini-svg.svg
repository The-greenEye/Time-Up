<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- خلفية بتدرج زجاجي أزرق عالي الفخامة -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a58ca" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- تدرج السهم والساعة -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- ظلال خفيفة لإعطاء عمق 3D -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- خلفية الأيقونة بمظهر App Icon بزوايا منحنية -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- رسمة الساعة والسهم الصاعد (Time Up / Check-in) -->
  <g filter="url(#glow)">
    <!-- إطار الساعة الدائري -->
    <circle cx="256" cy="276" r="140" fill="none" stroke="url(#iconGradient)" stroke-width="36" stroke-dasharray="720" stroke-dashoffset="120" stroke-linecap="round" />
    
    <!-- مؤشر/سهم الصعود المتجه للأعلى (Time Up) -->
    <path d="M 256 100 L 320 180 H 280 V 280 H 232 V 180 H 192 Z" fill="url(#iconGradient)" />

    <!-- علامة الصح/الحضور داخل الساعة -->
    <path d="M 210 290 L 245 325 L 315 250" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
